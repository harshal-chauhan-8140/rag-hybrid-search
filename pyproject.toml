[project]
name = "hybridsearch"
version = "0.1.0"
description = "Hybrid search in Postgres: full-text + pgvector + fusion"
readme = "README.md"
authors = [
    { name = "Harshal", email = "harshal@mamotechnolabs.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
]

[project.scripts]
hybridsearch = "hybridsearch.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
